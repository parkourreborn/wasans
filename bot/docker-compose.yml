services:
  bot:
    build: .
    restart: always
    ports:
      - "${PORT:-4500}:4500"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      API_SECRET: ${API_SECRET}
      PORT: ${PORT:-4500}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${PORT:-4500}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    depends_on:
      bot:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
