# Keeps the Compose project name the bot had in its own repo, so the first
# deploy from this monorepo replaces the old containers instead of starting a
# second copy of the bot next to them.
name: wasans-bot

services:
  bot:
    build: .
    restart: always
    ports:
      - "${PORT:-4500}:4500"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      SITE_TO_BOT_KEY: ${SITE_TO_BOT_KEY:-}
      BOT_TO_SITE_KEY: ${BOT_TO_SITE_KEY:-}
      # Old shared key; only used when the two keys above aren't set.
      API_SECRET: ${API_SECRET:-}
      PORT: ${PORT:-4500}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost ${PORT:-4500}"]
      interval: 10s
      timeout: 5s
      retries: 5

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    depends_on:
      bot:
        condition: service_healthy
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
